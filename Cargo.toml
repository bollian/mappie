[workspace]
resolver = "3"
members = [
    "operator-interface",
    "robot",
    "messages",
    "hardware-test",
    "hardware",
    "oix"
]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Ian Boll <mainbollian@gmail.com>"]

[profile.release]
strip = "symbols"

[workspace.dependencies]
adafruit_motorkit = "0.2.0"
anyhow = "1.0.95"
async-signal = "0.2.10"
clap = { version = "4.5.7", features = ["derive"] }
env_logger = { version = "0.11.3", default-features = false, features = ["auto-color", "humantime"] }
eyre = "0.6.12"
futures-lite = "2.3.0"
embedded-hal = "1.0.0"
hardware = { path = "hardware" }
hiwonder-encoder-motor-module = { git = "https://github.com/bollian/hiwonder-encoder-motor-module" }
inotify = { version = "0.11.0", default-features = false }
libc = "0.2.189"
linux-embedded-hal = "0.4.0"
log = "0.4.21"
messages = { path = "messages" }
mint = { version = "0.5.9", features = ["serde"] }
nalgebra = "0.33.2"
pwm-pca9685 = "1.0.0"
postcard = "1.0.8"
once_cell = "1.19.0"
rppal = { version = "0.22.1", features = ["embedded-hal"] }
rustix = { version = "1.1.4", features = ["fs", "time"] }
scopeguard = "1.2.0"
serde = { version = "1.0.203", features = ["derive"] }
serde_json = "1.0.117"
serialport = "4.9.0"
signal-hook = "0.3.17"
sysfs-pwm = { git = "https://github.com/bollian/rust-sysfs-pwm" }
tb6612fng = "0.2.0"
thiserror = "2.0.17"
tokio = { version = "1.52.3", features = ["net", "rt", "sync", "time", "signal", "parking_lot", "macros"] }

[patch.'crates-io'.xilem]
git = "https://github.com/linebender/xilem"
branch = "main"

[patch.'crates-io'.rpos_drv]
git = "https://github.com/bollian/rplidar.rs"
branch = "master"

[patch.'crates-io'.rplidar_drv]
git = "https://github.com/bollian/rplidar.rs"
branch = "master"
